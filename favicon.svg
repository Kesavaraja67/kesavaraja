<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="leather" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#5C3317" />
      <stop offset="100%" stop-color="#2A1506" />
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E098" />
      <stop offset="25%" stop-color="#E8C96A" />
      <stop offset="50%" stop-color="#C9A040" />
      <stop offset="75%" stop-color="#8B6914" />
      <stop offset="100%" stop-color="#C9A040" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="20" fill="url(#leather)" />
  
  <!-- Subtle border for depth -->
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect x="0" y="0" width="100" height="100" rx="20" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" />

  <text x="50" y="65" font-family="'Playfair Display', serif, Georgia" font-size="45" font-weight="900" fill="url(#brass)" text-anchor="middle" filter="url(#shadow)" style="letter-spacing:-2px;">KM</text>
</svg>
